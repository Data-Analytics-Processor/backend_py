services:
  backendaipy:
    # Use your Docker image name here
    image: goswamirohit/backendaipy:v1
    container_name: backendaipy
    restart: unless-stopped
    # Maps host port 8000 to the container's exposed port 8000 (from your Dockerfile)
    ports:
      - "8000:8000"
    # Tells Docker Compose to read environment variables from a .env file in the same directory
    env_file:
      - .env

    environment:
      - APP_ENV=${APP_ENV}
      - DEBUG=${DEBUG}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - DEFAULT_LLM_TEMPERATURE=${DEFAULT_LLM_TEMPERATURE}